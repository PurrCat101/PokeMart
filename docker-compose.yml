services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_local}
    ports: ["${MYSQL_HOST_PORT:-3306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema/001_create_shop_tables.sql:/docker-entrypoint-initdb.d/001_create_shop_tables.sql:ro
      - ./database/seed/001_seed_shop_data.sql:/docker-entrypoint-initdb.d/101_seed_shop_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange_me_root_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  pokemart-api:
    build:
      context: .
      dockerfile: apps/pokemart-api/Dockerfile
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-insecure-pokemart-jwt-secret-change-before-deploy}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      PORT: 3001
      POKEMART_API_BASE_URL: http://pokemart-api:3000
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      pokemart-api:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:3.10.0
    ports: ["8080:8080"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.18.3
    ports: ["8081:8080"]
    environment:
      URLS: '[{"url":"/openapi.yaml","name":"BFF Public API"},{"url":"/pokemart-openapi.yaml","name":"PokéMart Internal API"},{"url":"/shipping-mock-openapi.yaml","name":"PokéMart Shipping Mock API"}]'
      URLS_PRIMARY_NAME: BFF Public API
    volumes:
      - ./specs/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
      - ./specs/pokemart-openapi.yaml:/usr/share/nginx/html/pokemart-openapi.yaml:ro
      - ./specs/shipping-mock-openapi.yaml:/usr/share/nginx/html/shipping-mock-openapi.yaml:ro

  shipping-mock:
    build:
      context: .
      dockerfile: apps/shipping-mock/Dockerfile
    environment:
      PORT: 3002
    ports: ["3002:3002"]

  shipping-worker:
    build:
      context: .
      dockerfile: apps/pokemart-api/Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      SHIPPING_BASE_URL: http://shipping-mock:3002
      SHIPPING_REQUEST_TIMEOUT_MS: 2000
      SHIPPING_MAX_ATTEMPTS: 5
      SHIPPING_BATCH_SIZE: 10
      SHIPPING_POLL_INTERVAL_MS: 60000
      SHIPPING_STATUS_SYNC_INTERVAL_MS: 15000
    depends_on:
      mysql:
        condition: service_healthy
      shipping-mock:
        condition: service_started

volumes:
  mysql-data:
