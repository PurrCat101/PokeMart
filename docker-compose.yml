services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_local}
    ports: ["${MYSQL_HOST_PORT:-4306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Ping over TCP (127.0.0.1), not the socket. During first-time init MySQL runs a temporary
      # server with networking off; a socket ping passes then, and dependants hit "connection refused".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Applies database/liquibase/db.changelog-master.yaml, then exits. Services that need the
  # schema wait for it with `service_completed_successfully`, so nothing starts on an empty DB.
  liquibase:
    build:
      context: database/liquibase
    # Settings come from the environment (not CLI flags) so `make db-status` and friends only
    # pass a command name; absolute paths in flags get mangled by Git Bash on Windows.
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pokemart_lab}
      LIQUIBASE_COMMAND_USERNAME: ${MYSQL_USER:-pokemart_user}
      LIQUIBASE_COMMAND_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      LIQUIBASE_SEARCH_PATH: /liquibase/database/liquibase
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-schema,seed}
    command: ["update"]
    volumes:
      - ./database:/liquibase/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  pokemart-api:
    build:
      context: .
      dockerfile: apps/pokemart-api/Dockerfile
    environment:
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-insecure-pokemart-jwt-secret-change-before-deploy}
      PAYMENT_BASE_URL: http://payment-mock:4004
      KYC_BASE_URL: http://kyc-api:4005
      KYC_API_KEY: ${KYC_API_KEY:-local-only-kyc-key}
      KYC_REQUEST_TIMEOUT_MS: 2000
    ports: ["${POKEMART_API_HOST_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      payment-mock:
        condition: service_started
      kyc-api:
        condition: service_started

  payment-mock:
    build:
      context: .
      dockerfile: apps/payment-mock/Dockerfile
    environment:
      PORT: 4004
    ports: ["${PAYMENT_MOCK_HOST_PORT:-4004}:4004"]

  kyc-api:
    build:
      context: .
      dockerfile: apps/kyc-api/Dockerfile
    environment:
      PORT: 4005
      KYC_API_KEY: ${KYC_API_KEY:-local-only-kyc-key}
    ports: ["${KYC_API_HOST_PORT:-4005}:4005"]

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      PORT: 4001
      POKEMART_API_BASE_URL: http://pokemart-api:4000
    ports: ["${BFF_HOST_PORT:-4001}:4001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      pokemart-api:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:3.10.0
    ports: ["${WIREMOCK_HOST_PORT:-8080}:8080"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  api-reference:
    # Scalar renders every mounted OpenAPI file (BFF first, then internal services). It replaces Swagger UI.
    # The image scans /docs at start-up and builds one source per file, so no extra config is needed.
    image: scalarapi/api-reference:0.6.16
    ports: ["${API_REFERENCE_HOST_PORT:-8081}:8080"]
    volumes:
      - ./specs/openapi.yaml:/docs/1-bff-public-api.yaml:ro
      - ./specs/pokemart-openapi.yaml:/docs/2-pokemart-internal-api.yaml:ro
      - ./specs/kyc-openapi.yaml:/docs/3-kyc-api.yaml:ro
      - ./specs/payment-mock-openapi.yaml:/docs/4-payment-mock.yaml:ro
      - ./specs/shipping-mock-openapi.yaml:/docs/5-shipping-mock.yaml:ro

  shipping-mock:
    build:
      context: .
      dockerfile: apps/shipping-mock/Dockerfile
    environment:
      PORT: 4002
    ports: ["${SHIPPING_MOCK_HOST_PORT:-4002}:4002"]

  shipping-worker:
    build:
      context: .
      dockerfile: apps/pokemart-api/Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemart_lab}
      MYSQL_USER: ${MYSQL_USER:-pokemart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_development}
      SHIPPING_BASE_URL: http://shipping-mock:4002
      SHIPPING_REQUEST_TIMEOUT_MS: 2000
      SHIPPING_MAX_ATTEMPTS: 5
      SHIPPING_BATCH_SIZE: 10
      SHIPPING_POLL_INTERVAL_MS: 60000
      SHIPPING_STATUS_SYNC_INTERVAL_MS: 15000
      PAYMENT_BASE_URL: http://payment-mock:4004
      PAYMENT_POLL_INTERVAL_MS: 60000
      METRICS_PORT: 4010
    depends_on:
      mysql:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      shipping-mock:
        condition: service_started
      payment-mock:
        condition: service_started

  # ---- Observability (docker compose --profile observability up, or `make observe`) ----
  # Off by default so a normal `make up` stays light. Data is not persisted: `down` clears it.

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    # Disable the usage-statistics call home; the default config stores everything locally.
    command: ["-config.file=/etc/loki/local-config.yaml", "-reporting.enabled=false"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["observability"]
    # Reads container logs through the Docker socket (read-only) and pushes them to Loki.
    # Mounting the socket gives this container a view of every container on the machine: local lab only.
    user: root
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q Ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    # Bound to 127.0.0.1 on purpose: anonymous access below is for the local lab only.
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-4300}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pokemart-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
