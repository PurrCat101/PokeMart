<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
  <title id="title">PokéMart database entity relationship diagram</title>
  <desc id="description">Five MySQL tables. Pokémon reference has actual foreign-key relationships to shop listings, user inventory, and purchases. User IDs logically group wallet, inventory, and purchases but there is no users table or user foreign key.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1e293b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="logical-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .field { font-size: 14px; }
      .title { font-size: 17px; font-weight: 750; fill: #fff; }
      .muted { fill: #526079; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
      .relation { font-size: 12px; font-weight: 650; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="850" rx="26" fill="url(#background)"/>
  <text x="56" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#4f46e5">MYSQL · ENTITY RELATIONSHIPS</text>
  <text x="56" y="99" font-size="30" font-weight="750">PokéMart database schema</text>
  <text x="56" y="130" font-size="16" class="muted">Physical tables and keys from database/schema/001_create_shop_tables.sql</text>

  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#logical-arrow)">
    <path d="M720 230 V258 H220 V290"/>
    <path d="M720 230 V290"/>
    <path d="M720 230 V258 H1030 V290"/>
  </g>
  <rect x="592" y="181" width="256" height="52" rx="14" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="720" y="203" text-anchor="middle" class="tag" fill="#475569">LOGICAL IDENTITY (NOT A TABLE)</text>
  <text x="720" y="222" text-anchor="middle" class="mono">user_id</text>
  <g filter="url(#shadow)">
    <rect x="70" y="290" width="300" height="196" rx="16" fill="#fff"/>
    <path d="M86 290 H354 Q370 290 370 306 V336 H70 V306 Q70 290 86 290Z" fill="#7c3aed"/>
    <rect x="410" y="290" width="370" height="226" rx="16" fill="#fff"/>
    <path d="M426 290 H764 Q780 290 780 306 V336 H410 V306 Q410 290 426 290Z" fill="#059669"/>
    <rect x="850" y="290" width="500" height="256" rx="16" fill="#fff"/>
    <path d="M866 290 H1334 Q1350 290 1350 306 V336 H850 V306 Q850 290 866 290Z" fill="#ea580c"/>
    <rect x="410" y="610" width="370" height="190" rx="16" fill="#fff"/>
    <path d="M426 610 H764 Q780 610 780 626 V656 H410 V626 Q410 610 426 610Z" fill="#2563eb"/>
    <rect x="940" y="610" width="360" height="160" rx="16" fill="#fff"/>
    <path d="M956 610 H1284 Q1300 610 1300 626 V656 H940 V626 Q940 610 956 610Z" fill="#0891b2"/>
  </g>

  <g>
    <text x="92" y="320" class="title">user_wallet</text>
    <text x="92" y="365" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12" class="mono">user_id</tspan><tspan dx="12" class="muted">VARCHAR(64)</tspan></text>
    <text x="92" y="395" class="field"><tspan class="mono">balance</tspan><tspan dx="12" class="muted">INT NOT NULL</tspan></text>
    <text x="92" y="444" class="field muted">CHECK balance &gt;= 0</text>

    <text x="432" y="320" class="title">user_inventory</text>
    <text x="432" y="365" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12" class="mono">user_id</tspan><tspan dx="12" class="muted">VARCHAR(64)</tspan></text>
    <text x="432" y="395" class="field"><tspan font-weight="700">PK, FK</tspan><tspan dx="12" class="mono">pokemon_source_id</tspan></text>
    <text x="432" y="425" class="field"><tspan class="mono">quantity</tspan><tspan dx="12" class="muted">INT NOT NULL</tspan></text>
    <text x="432" y="474" class="field muted">Composite PK: (user_id, pokemon_source_id)</text>
    <text x="432" y="497" class="field muted">CHECK quantity &gt; 0</text>

    <text x="872" y="320" class="title">purchases</text>
    <text x="872" y="365" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12" class="mono">id</tspan><tspan dx="12" class="muted">CHAR(36)</tspan></text>
    <text x="872" y="395" class="field"><tspan class="mono">user_id</tspan><tspan dx="12" class="muted">VARCHAR(64)</tspan></text>
    <text x="872" y="425" class="field"><tspan font-weight="700">FK</tspan><tspan dx="12" class="mono">pokemon_source_id</tspan></text>
    <text x="872" y="455" class="field"><tspan class="mono">quantity, unit_price, total_price</tspan></text>
    <text x="872" y="485" class="field"><tspan class="mono">created_at</tspan><tspan dx="12" class="muted">TIMESTAMP(3)</tspan></text>
    <text x="872" y="521" class="field muted">INDEX (user_id, created_at DESC, id DESC)</text>

    <text x="432" y="640" class="title">pokemon_reference</text>
    <text x="432" y="685" class="field"><tspan font-weight="700">PK</tspan><tspan dx="12" class="mono">source_id</tspan><tspan dx="12" class="muted">INT</tspan></text>
    <text x="432" y="715" class="field"><tspan class="mono">name</tspan><tspan dx="12" class="muted">VARCHAR(64) UNIQUE</tspan></text>
    <text x="432" y="745" class="field"><tspan class="mono">base_experience, types, sprite_url</tspan></text>
    <text x="432" y="779" class="field muted">Reference snapshot; 151 seeded Pokémon</text>

    <text x="962" y="640" class="title">shop_listing</text>
    <text x="962" y="685" class="field"><tspan font-weight="700">PK, FK</tspan><tspan dx="12" class="mono">pokemon_source_id</tspan><tspan dx="8" class="muted">INT</tspan></text>
    <text x="962" y="715" class="field"><tspan class="mono">price, stock</tspan><tspan dx="12" class="muted">INT</tspan></text>
    <text x="962" y="745" class="field"><tspan class="mono">active</tspan><tspan dx="12" class="muted">BOOLEAN DEFAULT TRUE</tspan></text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)">
    <path d="M595 516 V610"/>
    <path d="M780 700 H940"/>
    <path d="M760 610 L850 546"/>
  </g>
  <rect x="605" y="548" width="186" height="27" rx="8" fill="#eef2ff"/>
  <text x="698" y="567" text-anchor="middle" class="relation">1 : many · FK</text>
  <rect x="790" y="672" width="145" height="27" rx="8" fill="#eef2ff"/>
  <text x="862" y="691" text-anchor="middle" class="relation">1 : 0..1 · PK/FK</text>
  <rect x="776" y="563" width="142" height="25" rx="8" fill="#eef2ff"/>
  <text x="847" y="581" text-anchor="middle" class="relation">1 : many · FK</text>

  <line x1="70" y1="824" x2="120" y2="824" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="132" y="829" class="small muted">Declared foreign key</text>
  <line x1="330" y1="824" x2="380" y2="824" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#logical-arrow)"/>
  <text x="392" y="829" class="small muted">Logical user_id association only (no users table / FK)</text>
  <text x="875" y="829" class="small muted">Unit and total price are stored on each purchase.</text>
</svg>
