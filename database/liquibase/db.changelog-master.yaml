# Liquibase master changelog for the PokéMart lab database.
#
# The baseline reuses the existing SQL files as they are (no copies to keep in sync):
#   schema/001_create_shop_tables.sql  -> the complete current schema, i.e. the result of
#                                         database/migrations/001-006 already folded in
#   seed/*.sql                         -> deterministic reference data (1,025 Pokémon,
#                                         2,222 items) and the demo account
#
# Contexts let you apply only part of it, e.g. `--contexts=schema` for an empty schema.
# New schema changes go below as numbered changesets; never edit a changeset that has been
# applied, because Liquibase stores a checksum of each one.
#
# A database created by the old docker-entrypoint-initdb.d flow already has all of this.
# Mark it as applied once with `make db-adopt` instead of running `update`.
databaseChangeLog:
  - changeSet:
      id: 001-baseline-schema
      author: pokemart
      context: schema
      comment: Complete schema (includes former migrations 001-006)
      changes:
        - sqlFile:
            path: ../schema/001_create_shop_tables.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 002-seed-demo-account
      author: pokemart
      context: seed
      comment: Demo trainer, wallet and KYC level (local lab only)
      changes:
        - sqlFile:
            path: ../seed/001_seed_shop_data.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 003-seed-reference-pokemon
      author: pokemart
      context: seed
      comment: 1,025 main National Pokédex Pokémon (pinned PokeAPI api-data commit)
      changes:
        - sqlFile:
            path: ../seed/010_reference_pokemon.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 004-seed-reference-items
      author: pokemart
      context: seed
      comment: 2,222 canonical PokeAPI item names
      changes:
        - sqlFile:
            path: ../seed/011_reference_items.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 005-seed-catalog
      author: pokemart
      context: seed
      comment: Shop listings, prices, stock and KYC levels
      changes:
        - sqlFile:
            path: ../seed/012_seed_catalog.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 006-kyc-catalog-levels
      author: pokemart
      context: seed
      comment: Level 0 buys nothing, level 1 buys ordinary listings, level 2 also buys the Master tier
      changes:
        - sqlFile:
            path: ../seed/013_kyc_catalog_levels.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 007-seed-kyc-test-users
      author: pokemart
      context: seed
      comment: One test account per KYC scenario, each with its own wallet (local lab only)
      changes:
        - sqlFile:
            path: ../seed/014_seed_kyc_test_users.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 008-seed-race-test-users
      author: pokemart
      context: seed
      comment: One test account per concurrency-safety scenario (local lab only)
      changes:
        - sqlFile:
            path: ../seed/015_seed_race_test_users.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 009-item-shipments
      author: pokemart
      context: schema
      comment: Item purchases ship too - item_shipments mirrors shipments (migration 007)
      changes:
        - sqlFile:
            path: ../migrations/007_create_item_shipments_table.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 010-unify-orders-shipments-inventory
      author: pokemart
      context: schema
      comment: Schema audit - fold item_purchases, item_shipments and user_item_inventory into purchases, shipments and user_inventory (migration 008)
      changes:
        - sqlFile:
            path: ../migrations/008_unify_orders_shipments_inventory.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 011-merge-listings
      author: pokemart
      context: schema
      comment: Schema audit part 2 - fold shop_listing and item_listing into listings (migration 009)
      changes:
        - sqlFile:
            path: ../migrations/009_merge_listings.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: 012-purchase-history-index
      author: pokemart
      context: schema
      comment: Index for the unified purchase history list across Pokémon and items (migration 010)
      changes:
        - sqlFile:
            path: ../migrations/010_purchase_history_index.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
