openapi: 3.0.3
info:
  title: PokéMart BFF API
  version: 2.0.0
  description: Public client-facing API. Version 2 response DTOs are intentionally distinct from the internal PokéMart API DTOs.
servers:
  - url: http://localhost:4001
tags:
  - { name: Authentication, description: Sign in and identify the current user. }
  - { name: Account, description: Profile and KYC level of the authenticated user. }
  - { name: Pokémon Catalog, description: Browse Pokémon listings. Public. }
  - { name: Item Catalog, description: Browse item listings and categories. Public. }
  - { name: Inventory, description: Pokémon owned by the authenticated user. }
  - { name: Pokémon Purchases, description: Buy a Pokémon and review purchase history. }
  - { name: Item Purchases, description: Buy items and review item orders. }
  - { name: Shipping, description: Shipment status for a purchase. }
  - { name: Wallet, description: Balance and THB top-ups. }
  - { name: Health, description: Liveness and readiness probes. }
x-tagGroups:
  - { name: Getting Started, tags: [Authentication, Account] }
  - { name: Shop, tags: [Pokémon Catalog, Item Catalog, Inventory] }
  - { name: Orders, tags: [Pokémon Purchases, Item Purchases, Shipping] }
  - { name: Wallet & Payments, tags: [Wallet] }
  - { name: System, tags: [Health] }
paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      description: |
        Returns a one-hour bearer token for the seeded local demo account or another provisioned user.
        Invalid credentials are reported generically. Registration and password reset are not provided.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Current user profile
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Error'
  /api/account-info:
    get:
      tags: [Account]
      summary: Get the authenticated user's profile, wallet, and KYC status in one request
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account information for the current user
          content: { application/json: { schema: { type: object, required: [user, wallet, kyc], properties: { user: { $ref: '#/components/schemas/CurrentUser' }, wallet: { type: object, required: [userId, balance], properties: { userId: { type: string }, balance: { type: number } } }, kyc: { nullable: true, description: 'null when the KYC service is unavailable; the rest of the response is still valid.', allOf: [{ $ref: '#/components/schemas/KycStatus' }] } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Error' }
  /api/pokemon:
    get:
      tags: [Pokémon Catalog]
      summary: List active catalog Pokémon
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: type, in: query, schema: { type: string, maxLength: 32 } }
        - { name: inStock, in: query, schema: { type: boolean } }
      responses:
        '200':
          $ref: '#/components/responses/PokemonPage'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/pokemon/{id}:
    get:
      tags: [Pokémon Catalog]
      summary: Get a catalog Pokémon and its listing
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `POKEMON_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PokemonId'
      responses:
        '200':
          $ref: '#/components/responses/Pokemon'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/wallet:
    get:
      tags: [Wallet]
      summary: Get the authenticated user's wallet
      security:
        - bearerAuth: []
      description: |
        Errors: 404 `USER_NOT_FOUND`; 500 `INTERNAL_ERROR`;
        503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/inventory:
    get:
      tags: [Inventory]
      summary: Get the authenticated user's Pokémon inventory
      security:
        - bearerAuth: []
      description: |
        Errors: 500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/Inventory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/purchases:
    get:
      tags: [Pokémon Purchases]
      summary: List the authenticated user's purchases
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/PurchasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags: [Pokémon Purchases]
      summary: Purchase a Pokémon
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR` or `INVALID_JSON`; 404 `POKEMON_NOT_FOUND`;
        409 `PURCHASE_DUPLICATE`, `POKEMON_NOT_FOR_SALE`, or `INSUFFICIENT_STOCK`;
        415 `UNSUPPORTED_MEDIA_TYPE`; 422 `INSUFFICIENT_FUNDS`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Purchase created
          headers:
            Location:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Purchase ID already committed, Pokémon not for sale, or insufficient stock
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/purchases/{id}:
    get:
      tags: [Pokémon Purchases]
      summary: Get a purchase
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `PURCHASE_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          $ref: '#/components/responses/Purchase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/purchases/{id}/shipment:
    get:
      tags: [Shipping]
      summary: Get the local shipment status for a purchase
      operationId: getPurchaseShipment
      security:
        - bearerAuth: []
      description: |
        Reads persisted PokéMart shipment state; does not call the external provider.
        A provider outage does not make this endpoint unavailable while MySQL is healthy.
        The result is scoped to the authenticated user's purchase.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Local shipment status
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /api/items:
    get:
      tags: [Item Catalog]
      summary: List active item listings from the pinned PokéAPI snapshot
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { type: string, maxLength: 64 } }
        - { name: inStock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Item page
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemPage' } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/item-categories:
    get:
      tags: [Item Catalog]
      summary: List active item categories for catalog filtering
      responses:
        '200':
          description: Item categories
          content: { application/json: { schema: { type: object, required: [categories], properties: { categories: { type: array, items: { type: string } } } } } }
        '503': { $ref: '#/components/responses/Error' }
  /api/items/purchases:
    post:
      tags: [Item Purchases]
      summary: Purchase one item listing
      security: [{ bearerAuth: [] }]
      description: The server enforces the item listing's KYC level, stock, and wallet balance atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purchaseId, itemId, quantity]
              properties:
                purchaseId: { type: string, format: uuid }
                itemId: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '201':
          description: Item purchased and added to item inventory
          headers:
            Location: { schema: { type: string, example: /api/items/purchases/6f1f0d7a-52a1-4c2a-9a0b-0c2e8f3d1a11 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemPurchase' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/items/purchases/{id}:
    get:
      tags: [Item Purchases]
      summary: Get a caller-owned item purchase
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Item purchase
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemPurchase' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/kyc/status:
    get:
      tags: [Account]
      summary: Get the caller's KYC level
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: KYC status
          content: { application/json: { schema: { $ref: '#/components/schemas/KycStatus' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Error' }
  /api/kyc/submissions:
    post:
      tags: [Account]
      summary: Submit identity details for verification
      description: Moves the account to `PENDING_REVIEW` at its current level. While under review, every purchase is rejected with `403 KYC_PENDING_REVIEW`. There is no automatic approval; the decision is made out of band (test-only in the lab).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycSubmissionRequest' }
      responses:
        '202':
          description: Submission accepted; the account is now under review
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content: { application/json: { schema: { $ref: '#/components/schemas/KycStatus' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/wallet/top-ups:
    post:
      tags: [Wallet]
      summary: Create and confirm an idempotent THB wallet top-up
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [topUpId, amount], properties: { topUpId: { type: string, format: uuid }, amount: { type: integer, minimum: 1, maximum: 10000 } } } } }
      responses:
        '201':
          description: Wallet credited once
          headers:
            Location: { schema: { type: string, example: /api/wallet/top-ups/6f1f0d7a-52a1-4c2a-9a0b-0c2e8f3d1a11 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TopUp' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/wallet/top-ups/{topUpId}:
    get:
      tags: [Wallet]
      summary: Get a caller-owned top-up state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: topUpId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Top-up state
          content: { application/json: { schema: { $ref: '#/components/schemas/TopUp' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Dependencies are ready
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Dependency unavailable
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Correlation ID present on every response.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  parameters:
    XRequestIdRequest:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID echoed when valid; otherwise generated by the BFF.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PokemonId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    KycStatus:
      type: object
      required: [level, status, updatedAt]
      properties:
        level: { type: integer, enum: [0, 1, 2], description: '0 = not verified, 1 = basic, 2 = advanced.' }
        status: { type: string, enum: [ACTIVE, PENDING_REVIEW, REJECTED] }
        updatedAt: { type: string, format: date-time }
    KycSubmissionRequest:
      type: object
      additionalProperties: false
      required: [fullName, nationalId, dateOfBirth, phone, address]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        nationalId: { type: string, pattern: '^[0-9]{13}$', description: 'Thai national ID; the last digit must be the correct check digit.' }
        dateOfBirth: { type: string, format: date, description: 'The applicant must be at least 18 years old.' }
        phone: { type: string, pattern: '^0[0-9]{9}$' }
        address: { type: string, minLength: 10, maxLength: 300 }
    ItemPage:
      type: object
      required: [totalCount, page, items]
      properties:
        totalCount: { type: integer }
        page: { type: object, required: [limit, offset], properties: { limit: { type: integer }, offset: { type: integer } } }
        items:
          type: array
          items:
            type: object
            required: [item, listing]
            properties:
              item: { type: object, required: [id, name, category, spriteUrl], properties: { id: { type: integer }, name: { type: string }, category: { type: string, nullable: true }, spriteUrl: { type: string, nullable: true } } }
              listing: { type: object, required: [price, availableStock, requiredKycLevel], properties: { price: { type: integer }, availableStock: { type: integer }, requiredKycLevel: { type: integer, enum: [0, 1, 2] } } }
    ItemPurchase:
      type: object
      required: [purchaseId, item, quantity, pricing, createdAt]
      properties:
        purchaseId: { type: string, format: uuid }
        item: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        quantity: { type: integer }
        pricing: { type: object, required: [unitPrice, totalPrice], properties: { unitPrice: { type: integer }, totalPrice: { type: integer } } }
        createdAt: { type: string, format: date-time }
    TopUp:
      type: object
      required: [topUpId, amount, status, createdAt, updatedAt]
      properties:
        topUpId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1, maximum: 10000 }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, UNKNOWN] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    UserProfile:
      type: object
      required: [userId, email, displayName]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Short-lived HS256 JWT access token.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'
    CurrentUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    PokemonSummary:
      type: object
      required: [id, name, types, spriteUrl]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        types:
          type: array
          items:
            type: string
        spriteUrl:
          type: string
          nullable: true
    Pokemon:
      type: object
      required: [pokemon, listing]
      properties:
        pokemon:
          $ref: '#/components/schemas/PokemonSummary'
        listing:
          type: object
          required: [price, availableStock]
          properties:
            price:
              type: integer
              minimum: 0
            availableStock:
              type: integer
              minimum: 0
    Page:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
        offset:
          type: integer
    PokemonPage:
      type: object
      required: [totalCount, page, items]
      properties:
        totalCount:
          type: integer
          minimum: 0
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pokemon'
    Wallet:
      type: object
      required: [wallet]
      properties:
        wallet:
          type: object
          required: [userId, balance]
          properties:
            userId:
              type: string
            balance:
              type: integer
              minimum: 0
    InventoryItem:
      type: object
      required: [pokemon, quantity]
      properties:
        pokemon:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          type: integer
          minimum: 1
    Inventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
    PurchaseRequest:
      type: object
      additionalProperties: false
      required: [purchaseId, pokemonId, quantity]
      properties:
        purchaseId:
          type: string
          format: uuid
          description: Client-generated UUID reused only when retrying this purchase attempt.
        pokemonId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    Purchase:
      type: object
      required: [purchaseId, pokemon, quantity, pricing, createdAt]
      properties:
        purchaseId:
          type: string
          format: uuid
        pokemon:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          type: integer
        pricing:
          type: object
          required: [unitPrice, totalPrice]
          properties:
            unitPrice:
              type: integer
            totalPrice:
              type: integer
        createdAt:
          type: string
          format: date-time
    PurchasePage:
      type: object
      required: [totalCount, page, items]
      properties:
        totalCount:
          type: integer
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [pokemartApi]
          properties:
            pokemartApi:
              type: string
              enum: [ok, unavailable]
    Shipment:
      type: object
      required: [purchaseId, orderStatus, processingStatus, deliveryStatus, trackingNumber, attemptCount, lastError, createdAt, updatedAt]
      additionalProperties: false
      properties:
        purchaseId:
          type: string
          format: uuid
        orderStatus:
          type: string
          enum: [ORDER_PLACED]
        processingStatus:
          type: string
          enum: [PENDING, PROCESSING, RETRY_WAIT, LABEL_CREATED, FAILED, UNKNOWN]
        deliveryStatus:
          type: string
          enum: [WAITING_FOR_SHIPMENT, LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, DELIVERY_FAILED]
        trackingNumber:
          type: string
          nullable: true
        attemptCount:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable, details]
          properties:
            retryable:
              type: boolean
              description: True only for transient failures (503); the same request may be resent unchanged. A POST must reuse its purchaseId or topUpId.
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNKNOWN_QUERY_PARAMETER
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - POKEMON_NOT_FOUND
                - USER_NOT_FOUND
                - PURCHASE_NOT_FOUND
                - POKEMON_NOT_FOR_SALE
                - ITEM_NOT_FOUND
                - ITEM_NOT_FOR_SALE
                - INSUFFICIENT_STOCK
                - INSUFFICIENT_FUNDS
                - PURCHASE_DUPLICATE
                - ITEM_PURCHASE_DUPLICATE
                - KYC_LEVEL_REQUIRED
                - KYC_PENDING_REVIEW
                - KYC_ALREADY_PENDING
                - KYC_ALREADY_VERIFIED
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
  responses:
    Pokemon:
      description: Pokémon with its shop listing
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pokemon'
    PokemonPage:
      description: Page of listed Pokémon
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PokemonPage'
    Wallet:
      description: User wallet
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wallet'
    Inventory:
      description: User inventory
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Inventory'
    Purchase:
      description: Purchase resource
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Purchase'
    PurchasePage:
      description: Page of purchases
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchasePage'
    Error:
      description: Error envelope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or incorrect authentication credentials
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: Email or password is incorrect
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
