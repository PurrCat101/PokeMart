openapi: 3.0.3
info:
  title: PokéMart BFF API
  version: 2.0.0
  description: Public client-facing API. Version 2 response DTOs are intentionally distinct from the internal PokéMart API DTOs.
servers:
  - url: http://localhost:3001
paths:
  /api/auth/login:
    post:
      summary: Sign in with email and password
      description: |
        Returns a one-hour bearer token for the seeded local demo account or another provisioned user.
        Invalid credentials are reported generically. Registration and password reset are not provided.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/me:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Current user profile
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Error'
  /api/pokemon:
    get:
      summary: List active catalog Pokémon
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/PokemonPage'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/pokemon/{id}:
    get:
      summary: Get a catalog Pokémon and its listing
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `POKEMON_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PokemonId'
      responses:
        '200':
          $ref: '#/components/responses/Pokemon'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/wallet:
    get:
      summary: Get the authenticated user's wallet
      security:
        - bearerAuth: []
      description: |
        Errors: 404 `USER_NOT_FOUND`; 500 `INTERNAL_ERROR`;
        503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/inventory:
    get:
      summary: Get the authenticated user's Pokémon inventory
      security:
        - bearerAuth: []
      description: |
        Errors: 500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/Inventory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/purchases:
    get:
      summary: List the authenticated user's purchases
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/PurchasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      summary: Purchase a Pokémon
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR` or `INVALID_JSON`; 404 `POKEMON_NOT_FOUND`;
        409 `PURCHASE_DUPLICATE`, `POKEMON_NOT_FOR_SALE`, or `INSUFFICIENT_STOCK`;
        415 `UNSUPPORTED_MEDIA_TYPE`; 422 `INSUFFICIENT_FUNDS`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Purchase created
          headers:
            Location:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Purchase ID already committed, Pokémon not for sale, or insufficient stock
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/purchases/{id}:
    get:
      summary: Get a purchase
      security:
        - bearerAuth: []
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `PURCHASE_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          $ref: '#/components/responses/Purchase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Liveness check
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      summary: Readiness check
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Dependencies are ready
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Dependency unavailable
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Correlation ID present on every response.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  parameters:
    XRequestIdRequest:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID echoed when valid; otherwise generated by the BFF.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PokemonId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    UserProfile:
      type: object
      required: [userId, email, displayName]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Short-lived HS256 JWT access token.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'
    CurrentUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    PokemonSummary:
      type: object
      required: [id, name, types, spriteUrl]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        types:
          type: array
          items:
            type: string
        spriteUrl:
          type: string
          nullable: true
    Pokemon:
      type: object
      required: [pokemon, listing]
      properties:
        pokemon:
          $ref: '#/components/schemas/PokemonSummary'
        listing:
          type: object
          required: [price, availableStock]
          properties:
            price:
              type: integer
              minimum: 0
            availableStock:
              type: integer
              minimum: 0
    Page:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
        offset:
          type: integer
    PokemonPage:
      type: object
      required: [totalCount, page, items]
      properties:
        totalCount:
          type: integer
          minimum: 0
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pokemon'
    Wallet:
      type: object
      required: [wallet]
      properties:
        wallet:
          type: object
          required: [userId, balance]
          properties:
            userId:
              type: string
            balance:
              type: integer
              minimum: 0
    InventoryItem:
      type: object
      required: [pokemon, quantity]
      properties:
        pokemon:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          type: integer
          minimum: 1
    Inventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
    PurchaseRequest:
      type: object
      additionalProperties: false
      required: [purchaseId, pokemonId, quantity]
      properties:
        purchaseId:
          type: string
          format: uuid
          description: Client-generated UUID reused only when retrying this purchase attempt.
        pokemonId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    Purchase:
      type: object
      required: [purchaseId, pokemon, quantity, pricing, createdAt]
      properties:
        purchaseId:
          type: string
          format: uuid
        pokemon:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
        quantity:
          type: integer
        pricing:
          type: object
          required: [unitPrice, totalPrice]
          properties:
            unitPrice:
              type: integer
            totalPrice:
              type: integer
        createdAt:
          type: string
          format: date-time
    PurchasePage:
      type: object
      required: [totalCount, page, items]
      properties:
        totalCount:
          type: integer
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [pokemartApi]
          properties:
            pokemartApi:
              type: string
              enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNKNOWN_QUERY_PARAMETER
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - POKEMON_NOT_FOUND
                - USER_NOT_FOUND
                - PURCHASE_NOT_FOUND
                - POKEMON_NOT_FOR_SALE
                - INSUFFICIENT_STOCK
                - INSUFFICIENT_FUNDS
                - PURCHASE_DUPLICATE
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
  responses:
    Pokemon:
      description: Pokémon with its shop listing
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pokemon'
    PokemonPage:
      description: Page of listed Pokémon
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PokemonPage'
    Wallet:
      description: User wallet
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wallet'
    Inventory:
      description: User inventory
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Inventory'
    Purchase:
      description: Purchase resource
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Purchase'
    PurchasePage:
      description: Page of purchases
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchasePage'
    Error:
      description: Error envelope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or incorrect authentication credentials
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: Email or password is incorrect
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
