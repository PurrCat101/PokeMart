openapi: 3.0.3
info:
  title: PokéMart API (service contract)
  version: 1.0.0
  description: |
    Service contract for the PokéMart API. Called by the BFF only. Not a public entry point.
    Business endpoints use the prefix `/pokemart/v1`. Health endpoints are not versioned.

    Business behavior is aligned with the public BFF contract, but internal response schemas are service-owned.
    Catalog reads are public. Wallet, inventory, and purchase resources require a bearer JWT.
servers:
  - url: http://localhost:3000
    description: Local lab (host port published by Docker Compose, for api-validation tests only)

tags:
  - name: Authentication
  - name: Catalog
  - name: Wallet
  - name: Inventory
  - name: Purchases
  - name: Health

paths:
  /pokemart/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Exchange credentials for an access token
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /pokemart/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the active profile represented by a bearer token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Current user profile
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /pokemart/v1/catalog/pokemon:
    get:
      tags: [Catalog]
      operationId: listCatalogPokemon
      summary: Paged catalog of listed Pokémon
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of catalog Pokémon
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/catalog/pokemon/{id}:
    get:
      tags: [Catalog]
      operationId: getCatalogPokemon
      summary: One Pokémon with its listing
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `POKEMON_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PokemonId'
      responses:
        '200':
          description: Pokémon with listing
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pokemon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/wallet:
    security:
      - bearerAuth: []
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Wallet of the caller
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `USER_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Wallet
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/inventory:
    security:
      - bearerAuth: []
    get:
      tags: [Inventory]
      operationId: getInventory
      summary: Owned Pokémon of the caller
      description: |
        Errors: 400 `VALIDATION_ERROR`; 500 `INTERNAL_ERROR`;
        503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Inventory
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/purchases:
    security:
      - bearerAuth: []
    post:
      tags: [Purchases]
      operationId: createPurchase
      summary: Create a purchase using a client-generated purchase ID
      description: |
        The caller generates a purchaseId before sending the request and reuses it only when retrying
        that same purchase attempt. The purchase ID, stock change, wallet change, and inventory change
        are committed in one transaction. Failed transactions do not reserve the purchaseId, so a retry
        with the same ID can succeed. Reusing an ID that was already committed returns 409 PURCHASE_DUPLICATE.
        Errors: 400 `VALIDATION_ERROR` or `INVALID_JSON`; 404 `POKEMON_NOT_FOUND`;
        409 `PURCHASE_DUPLICATE`, `POKEMON_NOT_FOR_SALE`, or `INSUFFICIENT_STOCK`;
        415 `UNSUPPORTED_MEDIA_TYPE`; 422 `INSUFFICIENT_FUNDS`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Purchase created
          headers:
            Location:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Purchases]
      operationId: listPurchases
      summary: Paged purchase history of the caller
      description: |
        Errors: 400 `VALIDATION_ERROR` or `UNKNOWN_QUERY_PARAMETER`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of purchases
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/purchases/{id}:
    security:
      - bearerAuth: []
    get:
      tags: [Purchases]
      operationId: getPurchase
      summary: One purchase of the caller
      description: |
        Errors: 400 `VALIDATION_ERROR`; 404 `PURCHASE_NOT_FOUND`;
        500 `INTERNAL_ERROR`; 503 `DEPENDENCY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Purchase
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /pokemart/v1/purchases/{id}/shipment:
    get:
      tags: [Purchases]
      operationId: getPurchaseShipment
      summary: Read persisted shipment state for the caller's purchase
      security:
        - bearerAuth: []
      description: |
        Reads MySQL only and does not proxy to the shipping provider.
        The result is scoped to the authenticated user's purchase.
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Local shipment status
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness, no dependency checks
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /ready:
    get:
      tags: [Health]
      operationId: getReady
      summary: Readiness, MySQL reachable and shop/user schema initialized
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: Ready
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Not ready; `checks.mysql` is `unavailable` or `uninitialized`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Correlation ID present on every response.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  parameters:
    XRequestIdRequest:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID from the BFF. Generated if absent or invalid.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PokemonId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PurchaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    UserProfile:
      type: object
      required: [userId, email, displayName]
      additionalProperties: false
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: Short-lived HS256 JWT access token.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'

    CurrentUser:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'

    Pokemon:
      type: object
      required: [id, name, types, spriteUrl, price, stock]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        types:
          type: array
          items:
            type: string
        spriteUrl:
          type: string
          nullable: true
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0

    PokemonPage:
      type: object
      required: [count, limit, offset, results]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Pokemon'

    Wallet:
      type: object
      required: [userId, balance]
      additionalProperties: false
      properties:
        userId:
          type: string
        balance:
          type: integer
          minimum: 0

    InventoryItem:
      type: object
      required: [pokemonId, name, quantity]
      additionalProperties: false
      properties:
        pokemonId:
          type: integer
          minimum: 1
        name:
          type: string
        quantity:
          type: integer
          minimum: 1

    Inventory:
      type: object
      required: [count, results]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'

    PurchaseRequest:
      type: object
      required: [purchaseId, pokemonId, quantity]
      additionalProperties: false
      properties:
        purchaseId:
          type: string
          format: uuid
          description: Client-generated UUID reused only when retrying this purchase attempt.
        pokemonId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    Purchase:
      type: object
      required: [id, pokemonId, pokemonName, quantity, unitPrice, totalPrice, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        pokemonId:
          type: integer
          minimum: 1
        pokemonName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: integer
          minimum: 0
        totalPrice:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    PurchasePage:
      type: object
      required: [count, limit, offset, results]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Purchase'

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Ready:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [mysql]
          properties:
            mysql:
              type: string
              enum: [ok, unavailable, uninitialized]

    Shipment:
      type: object
      required: [purchaseId, orderStatus, processingStatus, deliveryStatus, trackingNumber, attemptCount, lastError, createdAt, updatedAt]
      additionalProperties: false
      properties:
        purchaseId:
          type: string
          format: uuid
        orderStatus:
          type: string
          enum: [ORDER_PLACED]
        processingStatus:
          type: string
          enum: [PENDING, PROCESSING, RETRY_WAIT, LABEL_CREATED, FAILED, UNKNOWN]
        deliveryStatus:
          type: string
          enum: [WAITING_FOR_SHIPMENT, LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, DELIVERY_FAILED]
        trackingNumber:
          type: string
          nullable: true
        attemptCount:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId, details]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNKNOWN_QUERY_PARAMETER
                - INVALID_JSON
                - UNSUPPORTED_MEDIA_TYPE
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - POKEMON_NOT_FOUND
                - USER_NOT_FOUND
                - PURCHASE_NOT_FOUND
                - POKEMON_NOT_FOR_SALE
                - INSUFFICIENT_STOCK
                - INSUFFICIENT_FUNDS
                - PURCHASE_DUPLICATE
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string

  responses:
    BadRequest:
      description: Invalid input
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or incorrect authentication credentials
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: Email or password is incorrect
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Not for sale, insufficient stock, or duplicate purchase ID
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Body is not application/json
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Business rule violation, such as insufficient wallet funds
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected error. No internal details are exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: MySQL unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
